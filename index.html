<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content=" um site de login ">
    <title>login</title>
  </head>
  <body>
    <div class="container">
      <div class="form">
        <form action="pagina.html" method="get">
          <div class="ft">
            <img src="" alt="" />
          </div>
          <div class="lo"><h2>login</h2></div>
          <div class="d1">
            <label for="usuario"></label>
            <input
              type="text"
              name="usuario"
              id="usuario"
              placeholder="username" required
            />
          </div>
          <div class="d2">
            <label for="password"></label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="password" required
            />
          </div>
          <div class="d3">
            <label for="LOGIN"></label>
            <input type="submit" value="login" />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
